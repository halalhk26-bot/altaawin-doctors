<style>
:root{
  --brand:#c4000e; --brand-2:#23232b; --brand-soft:#fdecee;
  --bg:#f3f6f8; --card:#fff; --ink:#0f1c24; --muted:#5d6d77; --line:#e2e8ec;
  --s-working:#16a34a; --s-permission:#d97706; --s-stop:#e11d48; --s-leave:#7c3aed; --s-off:#64748b;
  --r:16px; --shadow:0 1px 2px rgba(15,28,36,.06),0 6px 24px rgba(15,28,36,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',system-ui,sans-serif;direction:rtl;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.brandbar{background:linear-gradient(120deg,var(--brand-2),var(--brand));color:#fff;position:relative;overflow:hidden}
.brandbar::after{content:"";position:absolute;inset:auto -10% -60% auto;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);pointer-events:none}
.logo-wrap{background:#fff;border-radius:14px;display:grid;place-items:center;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.15);flex:none}
.logo-wrap img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.light{background:var(--brand-soft);color:var(--brand-2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;color:#fff;white-space:nowrap}
.pill.bi .en{font-size:.78em;font-weight:600;opacity:.9;padding-inline-start:6px;margin-inline-start:2px;border-inline-start:1px solid rgba(255,255,255,.45);direction:ltr}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9}
.muted{color:var(--muted)}
.toast{position:fixed;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:92vw;background:#0f1c24;color:#fff;
  padding:12px 20px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;opacity:0;transform:translateY(20px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none} .toast.err{background:#b91c1c} .toast.ok{background:#15803d}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.demo-flag{position:fixed;left:10px;bottom:10px;background:#fde68a;color:#78350f;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;z-index:100}
</style>

      apiVerifyPin:(cid,pin)=>{ if(!pin) throw new Error('رمز الدخول غير صحيح'); return {ok:true,name:cname(cid)}; },
      apiBoard:board,
      apiSubmit:p=>{ const d=doctors.find(x=>x.id===p.docId); const t=Date.now();
        const c={status:p.status,dur:!p.durType?'—':(p.durType==='timed'?'لوقت محدد':'مستمر حتى إشعار'),from:p.from||t,to:p.durType==='timed'?p.to:null,note:p.note||'',by:p.by,at:t};
        cur[d.id]=c; logs.unshift({at:t,op:'U'+t,complex:cname(d.cid),docId:d.id,doctor:d.name,spec:d.spec,status:c.status,dur:c.dur,from:c.from,to:c.to,note:c.note,by:c.by}); return {ok:true,op:'U'+t}; },
      apiDashboard:(pin,f,t)=>{ if(!pin) throw new Error('رمز المشرف غير صحيح'); return {logs:logs.filter(l=>l.at>=f&&l.at<=t),board:board(),doctorsAll:doctors,complexes,baseUrl:'https://script.google.com/macros/s/XXXX/exec'}; },
      apiAddDoctor:(pin,d)=>{ const id='D'+String(doctors.length+1).padStart(3,'0'); doctors.push({id,cid:d.cid,name:d.name,spec:d.spec||'',clinic:d.clinic||'',active:true,order:999}); return {ok:true,id}; },
      apiToday:(since)=>logs.filter(l=>l.at>=since),
      apiSetFriday:(pin,id,v)=>{ doctors.find(x=>x.id===id).fri=v; return {ok:true}; },
      apiToggleDoctor:(pin,id,a)=>{ doctors.find(x=>x.id===id).active=a; return {ok:true}; }
    };
  })();

  APP.url = (page, extra) => {
    const base = APP.baseUrl || location.href.split('?')[0];
    const q = new URLSearchParams(Object.assign({page}, extra||{})); return base + '?' + q.toString();
  };
  /* شاشة الإعداد لأول مرة: لصق رابط تطبيق الويب */
  APP.showApiSetup = function(){
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(10,14,20,.92);display:grid;place-items:center;padding:20px;font-family:Tajawal,sans-serif;direction:rtl';
    o.innerHTML = `<div style="background:#fff;color:#111;border-radius:18px;padding:26px;max-width:620px;width:100%">
      <h2 style="margin:0 0 6px">ربط الشاشة بالبيانات</h2>
      <p style="margin:0 0 14px;color:#555">الصق رابط تطبيق الويب (الذي ينتهي بـ <b dir="ltr">/exec</b>). يُحفظ على هذا الجهاز مرة واحدة فقط.</p>
      <input id="apiIn" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:15px">
      <div id="apiMsg" style="color:#b91c1c;font-weight:700;min-height:22px;margin-top:8px"></div>
      <button id="apiGo" style="width:100%;padding:13px;border:0;border-radius:10px;background:#c4000e;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:4px">حفظ وتشغيل</button></div>`;
    document.body.appendChild(o);
    o.querySelector('#apiGo').onclick = async () => {
      const u = o.querySelector('#apiIn').value.trim(), msg = o.querySelector('#apiMsg');
      if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){ msg.textContent = 'الرابط لازم يكون رابط تطبيق ويب وينتهي بـ /exec'; return; }
      msg.style.color = '#555'; msg.textContent = 'جاري التحقق…';
      try{ const r = await fetch(u + '?api=board&t=' + Date.now(), {redirect:'follow'}); const j = await r.json(); if(!j.ok) throw new Error(j.error);
        try{ localStorage.setItem('ds_api', u); }catch(e){} location.reload();
      }catch(e){ msg.style.color = '#b91c1c'; msg.textContent = 'تعذّر الاتصال: تأكد أن النشر «Anyone» وأنك نشرت آخر نسخة من الكود.'; }
    };
  };
  APP.resetApi = () => { try{ localStorage.removeItem('ds_api'); }catch(e){} location.reload(); };
  /* فحص تطابق النسخة: يكشف إذا كانت ملفات Apps Script أو النشر قديماً */
  APP.checkVersion = function(serverV){
    if(APP._vWarned || !serverV || serverV === APP.CLIENT_VERSION) return;
    APP._vWarned = true;
    const w = document.createElement('div');
    w.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:998;background:#b45309;color:#fff;padding:10px 16px;border-radius:12px;font:700 14px Tajawal,sans-serif;direction:rtl;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;max-width:92vw';
    w.textContent = '⚠ نسخة الصفحة (' + APP.CLIENT_VERSION + ') لا تطابق نسخة الخادم (' + serverV + ') — حدّث ملفات Apps Script وانشر New version';
    w.onclick = () => w.remove(); document.body.appendChild(w);
  };
  document.addEventListener('DOMContentLoaded', () => { if(APP.isLive) APP.checkVersion(APP.version || 'قديمة'); });
  window.APP = APP;
  document.addEventListener('DOMContentLoaded', () => {
    if(window.STANDALONE && !APP.apiUrl){ APP.showApiSetup(); return; }
    if(!APP.isLive && !APP.isRemote){ const f=document.createElement('div'); f.className='demo-flag'; f.textContent='معاينة ببيانات تجريبية'; document.body.appendChild(f); }
  });
})();
</script>

<script>
const $ = s => document.querySelector(s);
const P = APP.params || {};
const T = {
  ar:{title:'الأطباء المتاحون الآن',org:'مجمعات التعاون الطبية',all:'الكل',avail:'متاح',availNow:'متاحون الآن',latest:'آخر التحديثات',latestSub:'آخر 6 ساعات',
      search:'ابحث باسم الطبيب أو التخصص…',becameAvail:'أصبح متاحاً',busy:'غير متاح مؤقتاً',back:'يعود',until:'حتى',live:'يتحدث تلقائياً',ago:'آخر تحديث',
      offline:'غير متصل — آخر بيانات',empty:'لا يوجد أطباء متاحون الآن',emptySub:'تواصل معنا لمعرفة أقرب موعد متاح',noRes:'لا توجد نتيجة',
      call:'اتصل للحجز',wa:'واتساب',note:'الحالات تتحدث تلقائياً كل دقيقة، وقد تتغير خلال اليوم. للحجز وتأكيد الموعد تواصل معنا.',other:'أخرى',min:'د',now:'الآن'},
  en:{title:'Doctors Available Now',org:'Al-Taawun Medical Clinics',all:'All',avail:'Available',availNow:'Available now',latest:'Latest updates',latestSub:'Last 6 hours',
      search:'Search doctor or specialty…',becameAvail:'Now available',busy:'Temporarily unavailable',back:'Back',until:'Until',live:'Live updates',ago:'Updated',
      offline:'Offline — last data',empty:'No doctors available right now',emptySub:'Contact us for the next available appointment',noRes:'No results',
      call:'Call to book',wa:'WhatsApp',note:'Statuses update automatically every minute and may change during the day. Please contact us to book and confirm.',other:'Other',min:'min',now:'now'}
};
let L = P.lang==='en' ? 'en' : (APP.store.get('pub_lang') || 'ar');
let cx = P.c || APP.store.get('pub_cx') || 'all';
let D = null, lastOk = 0;
const t = k => T[L][k];
const TITLE_EN = {'طبيب عام':'General Practitioner','أخصائي':'Specialist','أخصائي أول':'Senior Specialist','استشاري':'Consultant','طبيب مقيم':'Resident','طبيب أسنان عام':'General Dentist'};
APP.mountLogo($('#logo'));

/* ---------- البيانات ---------- */
const apiBase = () => (APP.apiUrl || APP.baseUrl || '').split('#')[0];
async function fetchPublic(){
  const base = apiBase();
  if(!base) return demoData();
  const key = 'ds_cache_public';
  try{
    const r = await fetch(base + (base.includes('?')?'&':'?') + 'api=public' + (window.API_KEY?'&key='+encodeURIComponent(window.API_KEY):'') + '&t=' + Math.floor(Date.now()/15000), {redirect:'follow'});
    const j = await r.json(); if(!j.ok) throw new Error(j.error);
    APP.checkVersion(j.version); APP.stale = null;
    try{ localStorage.setItem(key, JSON.stringify({at:Date.now(), data:j.data})); }catch(e){}
    return j.data;
  }catch(e){
    let c=null; try{ c=JSON.parse(localStorage.getItem(key)||'null'); }catch(_){}
    if(c){ APP.stale = c.at; return c.data; } throw e;
  }
}
async function demoData(){ // معاينة محلية فقط
  const b = await APP.call('apiBoard');
  const pub = s => s==='working'?'working':(s==='off'?'off':'busy');
  return { complexes:b.complexes, floors:b.floors||[], contact:{phone:'920009667',whatsapp:'966598233333'},
    doctors:b.doctors.map(d=>Object.assign({},d,{eff:pub(d.eff), cur:d.cur?{status:pub(d.cur.status),from:d.cur.from,to:d.cur.to,at:d.cur.at,by:''}:null})),
    recent:(b.recent||[]).slice(0,10).map(r=>({at:r.at,docId:r.docId,status:pub(r.status),to:r.to})) };
}
async function load(){
  try{
    D = await fetchPublic();
    APP.applySchedule(D);
    lastOk = Date.now(); render();
  }catch(e){ $('#live').classList.add('off'); $('#liveTxt').textContent = t('offline'); }
}

/* ---------- العرض ---------- */
const norm = s => String(s||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/^د\.\s*/,'').replace(/^dr\.?\s*/i,'').toLowerCase();
const nm = d => L==='en' && d.nameEn ? d.nameEn : d.name;
const nm2 = d => L==='en' ? d.name : (d.nameEn||'');
const sp = d => L==='en' ? (APP.specEn(d.spec) || APP.canonSpec(d.spec)) : APP.canonSpec(d.spec);
const tm = ms => L==='en' ? APP.fmtWhenEn(ms) : APP.fmtWhen(ms);
const tmin = m => L==='en' ? APP.fmtMinEn(m) : APP.fmtMin(m);
const cxName = id => { const c = D.complexes.find(x=>x.id===id); if(!c) return ''; return L==='en' ? APP.cxEn(c.name) : c.name.replace('التعاون ',''); };
function floorOf(d){
  const fl = (D.floors||[]).filter(f=>f.cid===d.cid); if(!fl.length) return '';
  const k = APP.canonSpec(d.spec), fk = x => String(x||'').replace(/[أإآ]/g,'ا').replace(/^ال/,'').trim();
  const f = (d.floor && fl.find(f => fk(f.name)===fk(d.floor) || String(f.order)===String(d.floor))) || fl.find(f => f.specs.some(s => APP.canonSpec(s)===k));
  return f ? (L==='en' ? (f.en||f.name) : f.name) : '';
}
function untilTxt(d){
  if(d.extra) return d.extra.open ? '' : t('until') + ' ' + tm(d.extra.until);
  return d.sch && d.sch.known && d.sch.end!=null ? t('until') + ' ' + tmin(d.sch.end) : '';
}

function applyLang(){
  document.documentElement.lang = L; document.body.classList.toggle('en', L==='en'); document.dir = L==='en'?'ltr':'rtl';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  $('#q').placeholder = t('search'); $('#lang').textContent = L==='en' ? 'ع' : 'EN';
  document.title = t('title') + ' | ' + t('org');
}
$('#lang').onclick = () => { L = L==='en'?'ar':'en'; APP.store.set('pub_lang', L); applyLang(); render(); };
$('#q').oninput = () => render();

function render(){
  if(!D) return;
  // التبويبات
  const tabs = [{id:'all'}].concat(D.complexes.map(c=>({id:c.id})));
  $('#tabs').innerHTML = tabs.map(x => {
    const n = D.doctors.filter(d=>(x.id==='all'||d.cid===x.id) && d.eff==='working').length;
    return `<button class="${cx===x.id?'on':''}" data-id="${x.id}">${x.id==='all'?t('all'):APP.esc(cxName(x.id))}<small>${n} ${t('avail')}</small></button>`;
  }).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { cx=b.dataset.id; APP.store.set('pub_cx',cx); render(); });

  const inCx = d => cx==='all' || d.cid===cx;
  const q = norm($('#q').value.trim());
  const match = d => !q || norm(d.name).includes(q) || norm(d.nameEn).includes(q) || norm(d.spec).includes(q) || norm(APP.specEn(d.spec)).includes(q);

  // آخر التحديثات
  const feed = (D.recent||[]).filter(r => { const d=D.doctors.find(x=>x.id===r.docId); return d && inCx(d) && r.status!=='off'; }).slice(0,8);
  $('#feedSec').hidden = !feed.length || !!q;
  $('#feed').innerHTML = feed.map(r => {
    const d = D.doctors.find(x=>x.id===r.docId), ok = r.status==='working';
    const m = Math.round((Date.now()-r.at)/60000);
    const ago = m<1 ? t('now') : m<60 ? (L==='en'? m+' '+t('min')+' ago' : 'منذ '+m+' '+t('min')) : tm(r.at);
    return `<div class="fi" style="--c:${ok?'#16a34a':'#64748b'}"><span class="t">${ago}</span><b>${APP.esc(nm(d))}</b>
      <span class="s">${ok?'✓ '+t('becameAvail'):t('busy')}</span>${!ok&&r.to?`<div class="m">⏱ ${t('back')} ${tm(r.to)}</div>`:''}
      <div class="m">${APP.esc(sp(d))}${cx==='all'?' · '+APP.esc(cxName(d.cid)):''}</div></div>`;
  }).join('');

  // المتاحون الآن — حسب التخصص
  const av = D.doctors.filter(d => d.eff==='working' && inCx(d) && match(d));
  $('#availN').textContent = av.length;
  const groups = {}, order = [];
  av.sort((a,z)=>a.order-z.order).forEach(d => { const k=sp(d); if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(d); });
  if(!av.length){
    $('#list').innerHTML = `<div class="card empty"><b>${q?t('noRes'):t('empty')}</b>${q?'':t('emptySub')}</div>`;
  } else {
    $('#list').innerHTML = order.map(k => {
      const fl = floorOf(groups[k][0]);
      return `<div class="grp"><div class="gh">${APP.esc(k)}${fl?`<span class="fl">📍 ${APP.esc(fl)}</span>`:''}</div>` + groups[k].map(d => {
        const u = untilTxt(d), init = nm(d).replace(/^(د\.|Dr\.)\s*/,'').charAt(0);
        return `<div class="card doc"><div class="av">${APP.esc(init)}</div>
          <div class="t"><b>${APP.esc(nm(d))}</b>${nm2(d)?`<span class="en">${APP.esc(nm2(d))}</span>`:''}<small>${APP.esc(L==='en' ? (TITLE_EN[d.title]||sp(d)) : (d.title||sp(d)))}${d.floor && floorOf(d)!==fl ? ' · 📍 '+APP.esc(floorOf(d)) : ''}${cx==='all'?`<span class="cxb">${APP.esc(cxName(d.cid))}</span>`:''}</small></div>
          <div class="r"><span class="ok">${t('avail')}</span>${u?`<small>${u}</small>`:''}</div></div>`;
      }).join('') + '</div>';
    }).join('');
  }

  // أزرار التواصل
  const c = D.contact || {};
  $('#bar').innerHTML = (c.phone?`<a class="call" href="tel:${APP.esc(c.phone)}">📞 ${t('call')} ${APP.esc(c.phone)}</a>`:'') + (c.whatsapp?`<a class="wa" href="https://wa.me/${APP.esc(c.whatsapp)}" target="_blank" rel="noopener">💬 ${t('wa')}</a>`:'');
  tickLive();
}
function tickLive(){
  if(APP.stale){ $('#live').classList.add('off'); $('#liveTxt').textContent = t('offline') + ' ' + tm(APP.stale); return; }
  $('#live').classList.remove('off');
  const s = Math.round((Date.now()-lastOk)/1000);
  $('#liveTxt').textContent = t('live') + ' · ' + t('ago') + ' ' + (s<60 ? (L==='en'? s+'s ago' : 'منذ '+s+' ث') : tm(lastOk));
}

applyLang(); load();
setInterval(() => { if(!document.hidden) load(); }, 60000);          // كل دقيقة، ويتوقف إذا الصفحة بالخلفية
document.addEventListener('visibilitychange', () => { if(!document.hidden && Date.now()-lastOk > 20000) load(); });
setInterval(tickLive, 5000);
</script>
</body>
</html>
